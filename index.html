<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

// === Neue Assets ===
const birdImg = new Image();
birdImg.src = 'bird.png'; // <-- hier dein hochgeladenes Bild (z. B. /mnt/data/b58dd529.png)
const pipeImg = new Image();
pipeImg.src = 'pipes.png'; // <-- Röhrenbild

const flapSound = new Audio('https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg'); // Sprungsound

const bird = { x: 50, y: HEIGHT / 2 - 12, width: 34, height: 24, gravity: 0.6, lift: -10, velocity: 0 };
const pipes = [];
const pipeWidth = 50;
const pipeGap = 120;
let frame = 0, score = 0, gameOver = false, started = false, countdown = 3;

// === Startbutton hinzufügen ===
const startBtn = document.createElement('button');
startBtn.textContent = 'START';
startBtn.style.fontFamily = "'Press Start 2P', cursive";
startBtn.style.fontSize = '16px';
startBtn.style.background = '#00cc00';
startBtn.style.color = 'white';
startBtn.style.border = '3px solid black';
startBtn.style.padding = '10px 20px';
startBtn.style.cursor = 'pointer';
startBtn.style.imageRendering = 'pixelated';
startBtn.style.boxShadow = '0 0 0 4px #008800 inset';
startBtn.style.marginTop = '10px';
document.body.appendChild(startBtn);

startBtn.onclick = () => {
  startBtn.remove();
  startCountdown();
};

// === Countdown ===
function startCountdown() {
  const interval = setInterval(() => {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = 'white';
    ctx.font = '40px "Press Start 2P"';
    if (countdown > 0) {
      ctx.fillText(countdown, WIDTH / 2 - 10, HEIGHT / 2);
    } else if (countdown === 0) {
      ctx.fillText('LOS!', WIDTH / 2 - 60, HEIGHT / 2);
    }
    countdown--;
    if (countdown < -1) {
      clearInterval(interval);
      started = true;
      update();
    }
  }, 800);
}

// === Neue Grafiken verwenden ===
function drawBird() {
  ctx.drawImage(birdImg, bird.x, bird.y, bird.width, bird.height);
}

function drawPipes() {
  pipes.forEach(pipe => {
    ctx.drawImage(pipeImg, pipe.x, pipe.top - 320, pipeWidth, 320); // oberes Rohr
    ctx.drawImage(pipeImg, pipe.x, pipe.bottom, pipeWidth, 320); // unteres Rohr
  });
}

function update() {
  if (!started || gameOver) {
    if (gameOver) {
      ctx.fillStyle = 'red';
      ctx.font = '24px "Press Start 2P"';
      ctx.fillText('GAME OVER', WIDTH / 2 - 120, HEIGHT / 2);
      ctx.font = '14px "Press Start 2P"';
      ctx.fillText('Punkte: ' + score, WIDTH / 2 - 60, HEIGHT / 2 + 30);
    }
    requestAnimationFrame(update);
    return;
  }

  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  bird.velocity += bird.gravity;
  bird.y += bird.velocity;

  if (bird.y + bird.height > HEIGHT || bird.y < 0) gameOver = true;

  if (frame % 90 === 0) {
    const topHeight = Math.floor(Math.random() * (HEIGHT - pipeGap - 80)) + 20;
    pipes.push({ x: WIDTH, top: topHeight, bottom: topHeight + pipeGap });
  }

  pipes.forEach((pipe, index) => {
    pipe.x -= 2;
    if (
      bird.x < pipe.x + pipeWidth &&
      bird.x + bird.width > pipe.x &&
      (bird.y < pipe.top || bird.y + bird.height > pipe.bottom)
    ) {
      gameOver = true;
    }
    if (pipe.x + pipeWidth < 0) {
      pipes.splice(index, 1);
      score++;
    }
  });

  drawPipes();
  drawBird();

  ctx.fillStyle = 'white';
  ctx.font = '16px "Press Start 2P"';
  ctx.fillText('Punkte: ' + score, 10, 20);

  frame++;
  if (!gameOver) requestAnimationFrame(update);
}

// === Sprung mit Sound ===
function flap() {
  if (started && !gameOver) {
    bird.velocity = bird.lift;
    flapSound.currentTime = 0;
    flapSound.play();
  }
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') flap();
});
window.addEventListener('click', flap);
window.addEventListener('touchstart', e => {
  e.preventDefault();
  flap();
}, { passive: false });
</script>
