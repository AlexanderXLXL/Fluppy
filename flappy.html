<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Flappy Bird Querformat - Bruh-Games(XL)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  body {
    margin: 0;
    background: #70c5ce;
    overflow: hidden;
    font-family: 'Press Start 2P', cursive;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Überschrift oben */
  #title {
    margin-top: 20px;
    font-size: 24px;
    color: white;
    text-shadow:
      -2px 0 blue,
      2px 0 blue,
      0 -2px blue,
      0 2px blue;
    user-select: none;
  }

  /* Container für Scroll-Animation */
  #scroll-container {
    position: relative;
    width: 480px;
    height: 320px;
    max-width: 95vw;
    max-height: 70vh;
    overflow: hidden;
    margin-top: auto;
    margin-bottom: 20px;
  }

  /* Das gesamte Spiel-Canvas und Inhalt wird animiert */
  #game-wrapper {
    position: absolute;
    top: -100%;
    left: 0;
    width: 480px;
    height: 320px;
    max-width: 100%;
    max-height: 100%;
    animation: scrollDown 3s forwards ease-in-out;
    animation-delay: 1.5s;
    background: #70c5ce;
  }

  @keyframes scrollDown {
    to {
      top: 0;
    }
  }

  canvas {
    background: #70c5ce;
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
  <div id="title">Bruh-Games(XL)</div>

  <div id="scroll-container">
    <div id="game-wrapper">
      <canvas id="game" width="480" height="320"></canvas>
    </div>
  </div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Angepasste Spielfeldgröße
  const WIDTH = canvas.width;  // 480
  const HEIGHT = canvas.height; // 320

  const bird = {
    x: 50,
    y: HEIGHT / 2 - 12, // Mitte
    width: 34,
    height: 24,
    gravity: 0.6,
    lift: -10,
    velocity: 0
  };

  const pipes = [];
  const pipeWidth = 50;
  const pipeGap = 120;
  let frame = 0;
  let score = 0;
  let gameOver = false;
  let started = false;

  // Starte das Spiel erst, wenn die Scroll-Animation durch ist (nach 4.5 Sekunden)
  setTimeout(() => {
    started = true;
    update();
  }, 4500);

  function drawBird() {
    ctx.fillStyle = 'yellow';
    ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
  }

  function drawPipes() {
    ctx.fillStyle = 'green';
    pipes.forEach(pipe => {
      // Oberes Rohr
      ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
      // Unteres Rohr
      ctx.fillRect(pipe.x, pipe.bottom, pipeWidth, HEIGHT - pipe.bottom);
    });
  }

  function update() {
    if (!started || gameOver) {
      if (gameOver) {
        ctx.fillStyle = 'red';
        ctx.font = '40px Arial';
        ctx.fillText('Game Over!', WIDTH / 2 - 120, HEIGHT / 2);
        ctx.font = '20px Arial';
        ctx.fillText('Punkte: ' + score, WIDTH / 2 - 40, HEIGHT / 2 + 30);
      }
      requestAnimationFrame(update);
      return;
    }

    // Hintergrund löschen
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    // Vogel Physik
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    // Grenzen checken (unten und oben)
    if (bird.y + bird.height > HEIGHT || bird.y < 0) {
      gameOver = true;
    }

    // Neue Rohre alle 90 Frames
    if (frame % 90 === 0) {
      const topHeight = Math.floor(Math.random() * (HEIGHT - pipeGap - 80)) + 20;
      pipes.push({
        x: WIDTH,
        top: topHeight,
        bottom: topHeight + pipeGap
      });
    }

    // Rohre bewegen und checken ob vorbei
    pipes.forEach((pipe, index) => {
      pipe.x -= 2;

      // Kollision prüfen
      if (
        bird.x < pipe.x + pipeWidth &&
        bird.x + bird.width > pipe.x &&
        (bird.y < pipe.top || bird.y + bird.height > pipe.bottom)
      ) {
        gameOver = true;
      }

      // Rohr aus Array entfernen wenn weg
      if (pipe.x + pipeWidth < 0) {
        pipes.splice(index, 1);
        score++;
      }
    });

    drawPipes();
    drawBird();

    // Score anzeigen
    ctx.fillStyle = 'white';
    ctx.font = '20px Arial';
    ctx.fillText('Punkte: ' + score, 10, 25);

    frame++;
    if (!gameOver) {
      requestAnimationFrame(update);
    }
  }

  // Steuerung nur aktiv wenn gestartet

  function flap() {
    if (started && !gameOver) {
      bird.velocity = bird.lift;
    }
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      flap();
    }
  });

  // Klick und Touch
  window.addEventListener('click', flap);
  window.addEventListener('touchstart', e => {
    e.preventDefault(); // verhindert Scrollen auf Mobilgeräten bei Touch
    flap();
  }, {passive: false});
</script>
</body>
</html>
